version: "2"

sql:
  - engine: "sqlite"
    schema: "db/migrations"
    queries: "db/query"
    gen:
      go:
        package: "query"
        out: "internal/db/query"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
